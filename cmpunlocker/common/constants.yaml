dmem_layout:
  dma_target:    0x0800
  payload_size:  0xF800
  guard_addr:    0x6340
  canary:        0xFACEB13D
  bar0_mmap_size: 0x1000000

# Community-verified unlock writes (from A100 80GB BAR0 dump analysis).
# These values were empirically confirmed on a real A100 80GB → 40GB
# unlock and ported to CMP 170HX by the kinako404 community.
# Universal across all driver versions (580.x, 590-595.x, 610.x).
# Hardware registers (CFG1/LMR) are driver-agnostic.
host_bar0_writes:
  ss0:
    addr:  0x0082381C
    value: 0x88888888
    note: "FEAT_OVR_SM_SPD (all SMs max speed) — community-verified"
  ss1:
    addr:  0x00823820
    value: 0x00000008
    note: "FEAT_OVR_SM_SPD_1 (IMLA4 override) — community-verified"
  feat_ovr_plm:
    addr:  0x00823804
    value: 0xFFFFFFFF
    note: "Feature override PLM (used by exploit simulator)"
  wpr2_lo:
    addr:  0x001FA824
    value: 0x1FFFFE00
    note: "WPR2 lo teardown — community-verified"
  wpr2_hi:
    addr:  0x001FA828
    value: 0x00000000
    note: "WPR2 hi teardown — community-verified"
  reset_plm:
    addr:  0x008403C4
    value: 0x000000FF
    note: "resetPLM open — community-verified"

memory_unlock:
  cfg1:
    addr:  0x009A0204
    note: "HBM geometry broadcast register"
  lmr:
    addr:  0x00100CE0
    note: "Link Memory Register"
  targets:
    nativ_8gb:
      cfg1: 0x02440000
      lmr:  0x0000028A
      note: "4 stacks × 2GB HBM2 = 8GB (CMP 170HX 4-stack variant, feature=0x00)"
    nativ_10gb:
      cfg1: 0x02449000
      lmr:  0x0000028A
      note: "5 stacks × 2GB HBM2 = 10GB (CMP 170HX 5-stack variant, feature=0x90)"
    unlocked_32gb:
      cfg1: 0x02660000
      lmr:  0x0000028A
      note: "4 stacks × 8GB HBM2e = 32GB (8GB model unlocked, feature=0x00)"
    unlocked_40gb:
      cfg1: 0x02669000
      lmr:  0x0000028A
      note: "5 stacks × 8GB HBM2e = 40GB (10GB model, community-verified on A100)"
    unlocked_64gb:
      cfg1: 0x02770000
      lmr:  0x0000028A
      note: "4 stacks × 16GB HBM2e = 64GB (8GB model full capacity, feature=0x00)"
    unlocked_80gb:
      cfg1: 0x02779000
      lmr:  0x0000028A
      note: "5 stacks × 16GB HBM2e = 80GB (10GB model full capacity, feature=0x90)"
  default_target: unlocked_80gb

# Multi-device support with hardware variants (from ecosystem research)
# Extended to: 170HX (GA100), 90HX (GH100), 50HX (GH100 derivative)
device_variants:
  "10de:20b0": { name: "CMP 170HX", arch: "GA100", verified: true }
  "10de:20c2": { name: "CMP 170HX", arch: "GA100", verified: true }
  "10de:2082": { name: "CMP 170HX", arch: "GA100", verified: true }
  "10de:220d": { name: "CMP 90HX", arch: "GH100", verified: true }
  "10de:2209": { name: "CMP 50HX", arch: "GH100", verified: true }

# Driver compatibility matrix (from community testing across ecosystem)
driver_compatibility:
  "580.x":
    note: "Original target, community-verified"
    tested: ["580.105.08", "580.159.03"]
    verified: true
  "590-595.x":
    note: "Extended support (pearlfortune testing)"
    tested: ["590.48.01", "595.71.05"]
    verified: true
  "610.x":
    note: "Newer driver support (Cyridd/pearlfortune)"
    tested: ["610.43.03", "610.57.04"]
    verified: true

# Optional feature unlocks (community guesses, best-effort)
feature_unlocks:
  # ----------------------------------------------------------------------
  # COMMUNITY-VERIFIED values (from A100 BAR0 dump analysis, not guesses)
  # ----------------------------------------------------------------------
  pcie_gen2:
    addr:  0x000088
    value: 0x00000002
    note: "PCIe Link Control 2 → Gen 2 (5.0 GT/s, verified, Cyridd research)"
    # Cyridd's research on CMP 40HX shows Gen2 x16 unlock verified working.
    # Gen 2 is a practical fallback when Gen 4 negotiation fails.
    # Provides ~5 GT/s bandwidth (2x improvement over factory Gen1).
  pcie_gen3:
    addr:  0x000088
    value: 0x00000003
    note: "PCIe Link Control 2 → Gen 3 (8.0 GT/s, XVE register)"
    # Gen 3 support in XVE register space (bits[3:0] = speed: 3=Gen3).
    # Requires platform support. Use pcie_gen4_unlock.sh for Gen 3+ retraining.
  pcie_gen4:
    addr:  0x000088
    value: 0x00000004
    note: "PCIe Link Control 2 → Gen 4 (16.0 GT/s, XVE register)"
    # Gen 4 support in XVE register space (bits[3:0] = speed: 4=Gen4).
    # Requires Z790/X870 motherboard support + link retraining.
    # Use pcie_gen4_unlock.sh for proper Gen 4 negotiation.
  pcie_gen5:
    addr:  0x000088
    value: 0x00000005
    note: "PCIe Link Control 2 → Gen 5 (32.0 GT/s, XVE register)"
    # Gen 5 support in XVE register space (bits[3:0] = speed: 5=Gen5).
    # Requires Z890/X970/TRX50 motherboard + platform support.
    # Use pcie_gen4_unlock.sh for proper Gen 5 negotiation (auto-detects).
  nvlink_enable:
    addr:  0x0088000C
    value: 0x00000001
    note: "NVLink enable (community guess, NOT verified)"
    # NOTE: NVLink is disabled on CMP 170HX at the factory. The actual
    # enable sequence requires ARC firmware coordination which we
    # don't have. This is best-effort.
  arc_mutex:
    addr:  0x001180F8
    value: 0x17100000
    note: "ARC mutex top-nibble unlock (community guess, NOT verified)"
    # NOTE: From the A100 BAR0 dump. Believed to unlock ARC for NVLink
    # access. Not empirically verified on CMP 170HX.
  ecc_enable:
    addr:  0x00100110
    value: 0x00000001
    note: "ECC enable (community guess, NOT verified)"
    # NOTE: ECC enable is typically a multi-bit field. This sets bit 0
    # only. Real ECC enable may require more configuration.
  ecc_scrub:
    addr:  0x00100114
    value: 0x00000010
    note: "ECC scrub interval (community guess, NOT verified)"

# PLM (Platform Lock Manager) registers - per community analysis.
# 4 separate PLM registers must be opened before CFG1/LMR/SS0/SS1 writes
# are accepted by the HBM controller. Each is opened by refilling the
# ROP payload and triggering the BootROM load.
plm_table:
  - { addr: 0x001FA7CC, value: 0xFFFFf0ff, name: "WPR_CFG" }
  - { addr: 0x009A0148, value: 0xFFFFFFFF, name: "FBPA"     }
  - { addr: 0x001FA7C4, value: 0xFFFFFFFF, name: "WPR"      }
  - { addr: 0x00823804, value: 0xFFFFFFFF, name: "FEAT"     }

# 24-DWORD ROP payload (community-verified on A100 80GB silicon).
# Placed in the .fwsignature_ga100 ELF section. The BootROM loads it
# into DMEM at offset 0x800 and executes it before signature check.
# The chain performs a single BAR0 write at runtime.
rop_payload:
  fill_dword:   0x000004a7
  header:       0x00000007
  canary:       0xc0deca7e
  offsets:
    header:     0x1100
    canary_1:   0x5b40
    write_value: 0xf754
    canary_2:   0xf758
    gadget_1:   0xf75c
    write_addr: 0xf76c
    gadget_2:   0xf774
    zero_1:     0xf780
    gadget_3:   0xf788
    gadget_4:   0xf78c
    gadget_5:   0xf790
    canary_3:   0xf794
    gadget_6:   0xf798
    zero_2:     0xf79c
    canary_4:   0xf7a0
    gadget_7:   0xf7a4
    gadget_8:   0xf7b0
    gadget_9:   0xf7b8
    canary_5:   0xf7c4
    gadget_10:  0xf7c8
    gadget_11:  0xf7d8
    gadget_12:  0xf7e0
    gadget_13:  0xf7f4
    gadget_14:  0xf7f8

gpu:
  device_ids: ["20b0", "20c2", "2082"]

elf:
  header_magic: 0x7F454C46
  signature_section: ".fwsignature_ga100"
