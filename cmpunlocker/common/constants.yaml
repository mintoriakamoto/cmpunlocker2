dmem_layout:
  dma_target:    0x0800
  payload_size:  0xF800
  guard_addr:    0x6340
  canary:        0xFACEB13D
  bar0_mmap_size: 0x1000000

# Community-verified unlock writes (from A100 80GB BAR0 dump analysis).
host_bar0_writes:
  ss0:
    addr:  0x0082381C
    value: 0x88888888
    note: "FEAT_OVR_SM_SPD (all SMs max speed) — community-verified"
  ss1:
    addr:  0x00823820
    value: 0x00000008
    note: "FEAT_OVR_SM_SPD_1 (IMLA4 override) — community-verified"
  feat_ovr_plm:
    addr:  0x00823804
    value: 0xFFFFFFFF
    note: "Feature override PLM (used by exploit simulator)"
  wpr2_lo:
    addr:  0x001FA824
    value: 0x1FFFFE00
    note: "WPR2 lo teardown — community-verified"
  wpr2_hi:
    addr:  0x001FA828
    value: 0x00000000
    note: "WPR2 hi teardown — community-verified"
  reset_plm:
    addr:  0x008403C4
    value: 0x000000FF
    note: "resetPLM open — community-verified"

memory_unlock:
  cfg1:
    addr:  0x009A0204
    note: "HBM geometry broadcast register"
  lmr:
    addr:  0x00100CE0
    note: "Link Memory Register"
  targets:
    nativ_8gb:
      cfg1: 0x02440000
      lmr:  0x0000028A
      note: "4 stacks x 2GB HBM2 = 8GB (CMP 170HX 4-stack variant, feature=0x00)"
    nativ_10gb:
      cfg1: 0x02449000
      lmr:  0x0000028A
      note: "5 stacks x 2GB HBM2 = 10GB (CMP 170HX 5-stack variant, feature=0x90)"
    unlocked_32gb:
      cfg1: 0x02660000
      lmr:  0x0000028A
      note: "4 stacks x 8GB HBM2e = 32GB (8GB model unlocked, feature=0x00)"
    unlocked_40gb:
      cfg1: 0x02669000
      lmr:  0x0000028A
      note: "5 stacks x 8GB HBM2e = 40GB (10GB model, community-verified on A100)"
    unlocked_64gb:
      cfg1: 0x02770000
      lmr:  0x0000028A
      note: "4 stacks x 16GB HBM2e = 64GB (8GB model full capacity, feature=0x00)"
    unlocked_80gb:
      cfg1: 0x02779000
      lmr:  0x0000028A
      note: "5 stacks x 16GB HBM2e = 80GB (10GB model full capacity, feature=0x90)"
  default_target: unlocked_40gb

device_variants:
  "10de:20b0": { name: "CMP 170HX", arch: "GA100", hbm_model: "10gb", lmr: 0x0000028A, verified: true }
  "10de:20c2": { name: "CMP 170HX", arch: "GA100", hbm_model: "8gb",  lmr: 0x0000020B, verified: true }
  "10de:2082": { name: "CMP 170HX", arch: "GA100", hbm_model: "10gb", lmr: 0x0000028A, verified: true }
  "10de:220d": { name: "CMP 90HX",  arch: "GH100", verified: true }
  "10de:2209": { name: "CMP 50HX",  arch: "GH100", verified: true }

driver_compatibility:
  "580.x":
    note: "Original target, community-verified"
    tested: ["580.105.08", "580.159.03"]
    verified: true
  "590-595.x":
    note: "Extended support (pearlfortune testing)"
    tested: ["590.48.01", "595.71.05"]
    verified: true
  "610.x":
    note: "Newer driver support (Cyridd/pearlfortune)"
    tested: ["610.43.03", "610.57.04"]
    verified: true

feature_unlocks:
  pcie_gen2:
    addr:  0x00088088
    value: 0x00000002
    note: "DEPRECATED: BAR0 alone doesn't work (needs 24-reg sequence). Using pcie_gen4_unlock.sh (setpci)"
  pcie_gen3:
    addr:  0x00088088
    value: 0x00000003
    note: "DEPRECATED: Correct addr 0x00088088 but needs 24-reg sequence. Use pcie_gen4_unlock.sh"
  pcie_gen4:
    addr:  0x00088088
    value: 0x00000004
    note: "DEPRECATED: Correct addr 0x00088088 but needs 24-reg sequence. Use pcie_gen4_unlock.sh"
  pcie_gen5:
    addr:  0x00088088
    value: 0x00000005
    note: "DEPRECATED: Correct addr 0x00088088 but needs 24-reg sequence. Use pcie_gen4_unlock.sh"

# PLM (Platform Lock Manager) registers - 11 registers must be opened.
# CRITICAL: Use firmware-actual values - firmware has protection bits set in some registers.
# Using 0xFFFFFFFF for FEAT/FEAT2 corrupts Falcon state, causing BooterLoad failure.
# WPR_CFG/WPR=0x0004cb8f, FBPA/XVE=0xffffff8f, FEAT/FEAT2=0xfffffcee
plm_table_40gb:
  - { addr: 0x001FA7CC, value: 0x0004cb8f, name: "WPR_CFG" }
  - { addr: 0x009A0148, value: 0xffffff8f, name: "FBPA"     }
  - { addr: 0x001FA7C4, value: 0x0004cb8f, name: "WPR"      }
  - { addr: 0x00823804, value: 0xfffffcee, name: "FEAT"     }
  - { addr: 0x00088FF4, value: 0xffffff8f, name: "XVE"      }
  - { addr: 0x00088AB4, value: 0xFFFFFFFF, name: "XVE_B"    }
  - { addr: 0x00088FF8, value: 0xFFFFFFFF, name: "XVE_C"    }
  - { addr: 0x00823B00, value: 0xfffffcee, name: "FEAT2"    }
  - { addr: 0x008200FC, value: 0xffffffff, name: "OPT_PLM"  }
  - { addr: 0x0000C840, value: 0xffffffff, name: "PJTAG_PLM" }
  - { addr: 0x0000C848, value: 0xffffffff, name: "PJTAG_SEC_PLM" }

plm_table_80gb:  # Same firmware-actual values as 40gb - PLM values are capacity-independent
  - { addr: 0x001FA7CC, value: 0x0004cb8f, name: "WPR_CFG" }
  - { addr: 0x009A0148, value: 0xffffff8f, name: "FBPA"     }
  - { addr: 0x001FA7C4, value: 0x0004cb8f, name: "WPR"      }
  - { addr: 0x00823804, value: 0xfffffcee, name: "FEAT"     }
  - { addr: 0x00088FF4, value: 0xffffff8f, name: "XVE"      }
  - { addr: 0x00088AB4, value: 0xFFFFFFFF, name: "XVE_B"    }
  - { addr: 0x00088FF8, value: 0xFFFFFFFF, name: "XVE_C"    }
  - { addr: 0x00823B00, value: 0xfffffcee, name: "FEAT2"    }
  - { addr: 0x008200FC, value: 0xffffffff, name: "OPT_PLM"  }
  - { addr: 0x0000C840, value: 0xffffffff, name: "PJTAG_PLM" }
  - { addr: 0x0000C848, value: 0xffffffff, name: "PJTAG_SEC_PLM" }

plm_table: plm_table_40gb

